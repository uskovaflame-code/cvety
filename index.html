<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полив — проверка данных</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{color-scheme:light}
  body{margin:0;padding:18px 16px 40px;font:15px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
       background:#EAF1E8;color:#12291D}
  h1{font:600 21px/1.3 Georgia,serif;margin:0 0 4px}
  .sub{color:#5C7565;font-size:13px;margin-bottom:16px}
  .box{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;
       box-shadow:0 10px 24px -14px rgba(18,41,29,.4)}
  .box h2{font:600 15px/1.3 Georgia,serif;margin:0 0 8px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(18,41,29,.07);font-size:14px}
  .row:last-child{border-bottom:0}
  .row b{font-weight:600;text-align:right}
  .ok{color:#2C6E49}.bad{color:#A8493A}.warn{color:#8E6415}
  pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#F3F8F1;
      padding:10px;border-radius:12px;margin:8px 0 0;max-height:220px;overflow:auto}
  button{font:inherit;border:0;width:100%;padding:15px;border-radius:16px;margin-top:10px;
         font-weight:600;cursor:pointer}
  .go{background:#2C6E49;color:#fff}
  .ghost{background:#DFE9DA;color:#2C6E49}
  .note{font-size:13px;color:#5C7565;margin-top:10px}
</style>
</head>
<body>
<h1>Проверка данных</h1>
<div class="sub">Эта страница только читает. Она ничего не записывает и не удаляет.</div>
<div id="out"><div class="box">Читаю…</div></div>

<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
const CS = TG && TG.CloudStorage && TG.CloudStorage.getItem ? TG.CloudStorage : null;
const KEY='plants';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function csGet(k){ return new Promise(r=>{ try{ CS.getItem(k,(e,v)=>r(e?null:v)); }catch(e){ r(null); } }); }
function csKeys(){ return new Promise(r=>{ try{ CS.getKeys((e,v)=>r(e?[]:(v||[]))); }catch(e){ r([]); } }); }

function describe(raw,where){
  const res={where,len:raw?raw.length:0,ok:false,plants:0,records:0,ferts:0,err:''};
  if(!raw) { res.err='пусто'; return res; }
  try{
    const d=JSON.parse(raw);
    res.ok=!!(d&&d.plants);
    res.plants=(d&&d.plants&&d.plants.length)||0;
    res.records=(d&&d.records&&d.records.length)||0;
    res.ferts=(d&&d.ferts&&d.ferts.length)||0;
    res.names=(d&&d.plants||[]).slice(0,8).map(p=>p.name).join(', ');
  }catch(e){ res.err='не разбирается: '+e.message; }
  return res;
}

/* Выбирает из обрывков целые объекты: считает скобки, уважая строки */
const BS=String.fromCharCode(92);   /* обратная косая — через код, чтобы не терялась при правках */
function scanObjects(s){
  const out=[]; let i=0;
  while(i<s.length){
    if(s.charAt(i)!=='{'){ i++; continue; }
    let d=0,j=i,inStr=false,esc=false,closed=false;
    for(; j<s.length; j++){
      const c=s.charAt(j);
      if(inStr){
        if(esc) esc=false;
        else if(c===BS) esc=true;
        else if(c==='"') inStr=false;
        continue;
      }
      if(c==='"'){ inStr=true; continue; }
      if(c==='{') d++;
      else if(c==='}'){ d--; if(d===0){ out.push(s.slice(i,j+1)); closed=true; break; } }
    }
    i = closed ? j+1 : i+1;
  }
  return out;
}
function harvest(raw){
  const plants=[],records=[],seenP={},seenR={};
  scanObjects(raw||'').forEach(t=>{
    let o; try{ o=JSON.parse(t); }catch(e){ return; }
    if(!o||typeof o!=='object'||Array.isArray(o)) return;
    if(o.id && o.name!==undefined && o.waterEvery!==undefined){
      if(!seenP[o.id]){ seenP[o.id]=1; plants.push(o); }
    } else if(o.plantId && o.date && o.types){
      const k=o.id||(o.plantId+'|'+o.date+'|'+[].concat(o.types).join(','));
      if(!seenR[k]){ seenR[k]=1; records.push(o); }
    }
  });
  const have={}; plants.forEach(p=>{ have[p.id]=1; });
  const lost=[];
  records.forEach(r=>{ if(!have[r.plantId] && lost.indexOf(r.plantId)<0) lost.push(r.plantId); });
  lost.forEach((id,k)=>{
    plants.push({id:id,name:'Растение '+(k+1)+' — впиши название',emoji:'🪴',group:'home',
                 place:'',waterEvery:7,feedEvery:21,note:'Имя потерялось при сбое, записи целы'});
  });
  return {data:{plants:plants,records:records,filter:'all',theme:'light',ferts:[]},lost:lost.length};
}

let RECOVER=null;   // сюда положим лучший найденный набор

(async function(){
  const parts=[];
  const add=h=>parts.push(h);

  /* ---- телеграм ---- */
  add('<div class="box"><h2>Телеграм</h2>'+
      row('Открыто внутри телеграма', TG?'да':'НЕТ', TG?'ok':'bad')+
      row('Версия', TG?(TG.version||'?'):'—', '')+
      row('Облако доступно', CS?'да':'НЕТ', CS?'ok':'bad')+
      '</div>');

  /* ---- локальная копия на телефоне ---- */
  let ls=null;
  try{ ls=localStorage.getItem(KEY); }catch(e){}
  const lsInfo=describe(ls,'localStorage');
  add('<div class="box"><h2>Копия на телефоне</h2>'+
      row('Символов', lsInfo.len, lsInfo.len?'ok':'bad')+
      row('Растений', lsInfo.plants, lsInfo.plants?'ok':'bad')+
      row('Записей', lsInfo.records, lsInfo.records?'ok':'bad')+
      (lsInfo.err?row('Ошибка', lsInfo.err, 'bad'):'')+
      (lsInfo.names?('<div class="note">'+esc(lsInfo.names)+'</div>'):'')+
      '</div>');
  if(lsInfo.ok && lsInfo.plants) RECOVER={raw:ls,info:lsInfo};

  if(!CS){
    add('<div class="box"><h2>Облако недоступно</h2><div class="note">Открой эту страницу через бота в телеграме, а не в браузере.</div></div>');
    return done(parts);
  }

  /* ---- что вообще лежит в облаке ---- */
  let keys=await csKeys();
  if(!keys.length){                    // getKeys может не поддерживаться — щупаем вручную
    const probe=[KEY+'_n'];
    for(let i=0;i<80;i++) probe.push(KEY+'_'+i);
    for(const k of probe){ const v=await csGet(k); if(v!=null&&v!=='') keys.push(k); }
  }
  const isChunk=k=>k.indexOf(KEY+'_')===0 && /^[0-9]+$/.test(k.slice(KEY.length+1));
  const idx=keys.filter(isChunk).map(k=>parseInt(k.slice(KEY.length+1),10)).sort((a,b)=>a-b);
  const photo=keys.filter(k=>k.indexOf('ph_')===0);
  const other=keys.filter(k=>k.indexOf('ph_')!==0 && k!==KEY+'_n' && !isChunk(k));

  add('<div class="box"><h2>Ячейки в облаке</h2>'+
      row('Всего', keys.length+' из 1024', keys.length>=1000?'bad':(keys.length>900?'warn':'ok'))+
      row('Кусков основных данных', idx.length, idx.length?'ok':'bad')+
      row('Фото', photo.length, '')+
      row('Прочее', other.length, '')+
      '</div>');

  /* ---- читаем ВСЕ куски, а не только те, что в счётчике ---- */
  const nRaw=await csGet(KEY+'_n');
  const n=parseInt(nRaw||'0',10);
  const chunk={}; const lens=[];
  for(const i of idx){
    const v=await csGet(KEY+'_'+i);
    chunk[i]=v||'';
    lens.push(i+':'+chunk[i].length);
  }
  const join=list=>list.map(i=>chunk[i]||'').join('');

  const byCounter = join(idx.filter(i=>i<n));
  const all       = join(idx);
  const tail      = join(idx.filter(i=>i>0));     // без первого куска — вдруг его затёрли

  const infoCounter=describe(byCounter,'по счётчику');
  const infoAll=describe(all,'все куски');
  const infoTail=describe(tail,'хвост без первого куска');

  add('<div class="box"><h2>Основные данные</h2>'+
      row('Счётчик кусков', nRaw==null?'нет':nRaw, n?'ok':'bad')+
      row('Кусков найдено', idx.length, idx.length?'ok':'bad')+
      row('Длины кусков', lens.join('  ')||'—','')+
      '</div>');

  add('<div class="box"><h2>Что удалось собрать</h2>'+
      row('По счётчику', infoCounter.ok?('растений '+infoCounter.plants+', записей '+infoCounter.records):'не разбирается', infoCounter.ok?'ok':'bad')+
      row('Из всех кусков', infoAll.ok?('растений '+infoAll.plants+', записей '+infoAll.records):'не разбирается', infoAll.ok?'ok':'bad')+
      row('Длина хвоста', tail.length, tail.length?'warn':'')+
      (tail.length?('<div class="note">Начало хвоста:</div><pre>'+esc(tail.slice(0,400))+'…</pre>'):'')+
      '</div>');

  /* ---- сборка по кусочкам, если целиком не разобралось ---- */
  const H=harvest(all + (ls||''));
  const hRaw=JSON.stringify(H.data);
  const hInfo=describe(hRaw,'собрано по кусочкам');
  add('<div class="box"><h2>Сборка по кусочкам</h2>'+
      row('Растений', hInfo.plants, hInfo.plants?'ok':'bad')+
      row('Записей', hInfo.records, hInfo.records?'ok':'bad')+
      row('Без названия', H.lost, H.lost?'warn':'ok')+
      (H.lost?'<div class="note">Названия таких растений потерялись, но их записи целы — название можно вписать заново.</div>':'')+
      '</div>');

  window.__RAW={byCounter:byCounter,all:all,tail:tail,n:n,idx:idx,harvested:hRaw};

  const cands=[];
  if(infoAll.ok && infoAll.plants)         cands.push({raw:all,info:infoAll});
  if(infoCounter.ok && infoCounter.plants) cands.push({raw:byCounter,info:infoCounter});
  if(lsInfo.ok && lsInfo.plants)           cands.push({raw:ls,info:lsInfo});
  if(hInfo.ok && (hInfo.records||hInfo.plants)) cands.push({raw:hRaw,info:hInfo});
  cands.sort(function(a,b){ return (b.info.records-a.info.records)||(b.info.plants-a.info.plants); });
  RECOVER=cands[0]||null;

  done(parts);
})().catch(e=>{
  $('#out').innerHTML='<div class="box"><h2 class="bad">Сбой проверки</h2><pre>'+esc(e&&e.message)+'</pre></div>';
});

function row(k,v,cls){ return '<div class="row"><span>'+esc(k)+'</span><b class="'+(cls||'')+'">'+esc(v)+'</b></div>'; }

function done(parts){
  if(RECOVER){
    parts.push('<div class="box"><h2 class="ok">Данные найдены</h2>'+
      row('Откуда', RECOVER.info.where, 'ok')+
      row('Растений', RECOVER.info.plants, 'ok')+
      row('Записей', RECOVER.info.records, 'ok')+
      '<div class="note">Можно вернуть их в приложение. Кнопка запишет найденный набор обратно в облако.</div>'+
      '<button class="go" id="fix">Вернуть эти данные</button></div>');
  } else {
    parts.push('<div class="box"><h2 class="bad">Готового набора не нашлось</h2>'+
      '<div class="note">Пришли снимок этого экрана — по цифрам выше будет видно, что уцелело.</div></div>');
  }
  parts.push('<div class="box"><button class="ghost" id="copy">Скопировать отчёт</button>'+
    '<button class="ghost" id="dump">Скопировать сырые данные</button></div>');
  $('#out').innerHTML=parts.join('');

  const fix=$('#fix');
  if(fix) fix.onclick=async()=>{
    fix.disabled=true; fix.textContent='Возвращаю…';
    const raw=RECOVER.raw, CHUNK=3500;
    try{ localStorage.setItem(KEY,raw); }catch(e){}
    if(CS){
      const ps=[]; for(let i=0;i<raw.length;i+=CHUNK) ps.push(raw.slice(i,i+CHUNK));
      for(let i=0;i<ps.length;i++){ await new Promise(r=>{ try{ CS.setItem(KEY+'_'+i,ps[i],()=>r()); }catch(e){ r(); } }); }
      await new Promise(r=>{ try{ CS.setItem(KEY+'_n',String(ps.length),()=>r()); }catch(e){ r(); } });
    }
    fix.textContent='Готово — открой приложение';
    fix.className='ghost';
  };
  const dump=$('#dump');
  if(dump) dump.onclick=()=>{
    const R=window.__RAW||{};
    const t='n='+R.n+' idx='+((R.idx||[]).join(','))+'\n---ALL---\n'+(R.all||'')+'\n---TAIL---\n'+(R.tail||'');
    try{ navigator.clipboard.writeText(t); }catch(e){}
    dump.textContent='Скопировано — вставь в чат';
  };
  $('#copy').onclick=()=>{
    const t=document.body.innerText;
    try{ navigator.clipboard.writeText(t); }catch(e){}
    $('#copy').textContent='Скопировано';
  };
}
</script>
</body>
</html>
