<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Полив — проверка данных</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{color-scheme:light}
  body{margin:0;padding:18px 16px 40px;font:15px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;
       background:#EAF1E8;color:#12291D}
  h1{font:600 21px/1.3 Georgia,serif;margin:0 0 4px}
  .sub{color:#5C7565;font-size:13px;margin-bottom:16px}
  .box{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;
       box-shadow:0 10px 24px -14px rgba(18,41,29,.4)}
  .box h2{font:600 15px/1.3 Georgia,serif;margin:0 0 8px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid rgba(18,41,29,.07);font-size:14px}
  .row:last-child{border-bottom:0}
  .row b{font-weight:600;text-align:right}
  .ok{color:#2C6E49}.bad{color:#A8493A}.warn{color:#8E6415}
  pre{white-space:pre-wrap;word-break:break-all;font-size:11px;background:#F3F8F1;
      padding:10px;border-radius:12px;margin:8px 0 0;max-height:220px;overflow:auto}
  button{font:inherit;border:0;width:100%;padding:15px;border-radius:16px;margin-top:10px;
         font-weight:600;cursor:pointer}
  .go{background:#2C6E49;color:#fff}
  .ghost{background:#DFE9DA;color:#2C6E49}
  .note{font-size:13px;color:#5C7565;margin-top:10px}
</style>
</head>
<body>
<h1>Проверка данных</h1>
<div class="sub">Эта страница только читает. Она ничего не записывает и не удаляет.</div>
<div id="out"><div class="box">Читаю…</div></div>

<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
const CS = TG && TG.CloudStorage && TG.CloudStorage.getItem ? TG.CloudStorage : null;
const KEY='plants';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function csGet(k){ return new Promise(r=>{ try{ CS.getItem(k,(e,v)=>r(e?null:v)); }catch(e){ r(null); } }); }
function csKeys(){ return new Promise(r=>{ try{ CS.getKeys((e,v)=>r(e?[]:(v||[]))); }catch(e){ r([]); } }); }

function describe(raw,where){
  const res={where,len:raw?raw.length:0,ok:false,plants:0,records:0,ferts:0,err:''};
  if(!raw) { res.err='пусто'; return res; }
  try{
    const d=JSON.parse(raw);
    res.ok=!!(d&&d.plants);
    res.plants=(d&&d.plants&&d.plants.length)||0;
    res.records=(d&&d.records&&d.records.length)||0;
    res.ferts=(d&&d.ferts&&d.ferts.length)||0;
    res.names=(d&&d.plants||[]).slice(0,8).map(p=>p.name).join(', ');
  }catch(e){ res.err='не разбирается: '+e.message; }
  return res;
}

let RECOVER=null;   // сюда положим лучший найденный набор

(async function(){
  const parts=[];
  const add=h=>parts.push(h);

  /* ---- телеграм ---- */
  add('<div class="box"><h2>Телеграм</h2>'+
      row('Открыто внутри телеграма', TG?'да':'НЕТ', TG?'ok':'bad')+
      row('Версия', TG?(TG.version||'?'):'—', '')+
      row('Облако доступно', CS?'да':'НЕТ', CS?'ok':'bad')+
      '</div>');

  /* ---- локальная копия на телефоне ---- */
  let ls=null;
  try{ ls=localStorage.getItem(KEY); }catch(e){}
  const lsInfo=describe(ls,'localStorage');
  add('<div class="box"><h2>Копия на телефоне</h2>'+
      row('Символов', lsInfo.len, lsInfo.len?'ok':'bad')+
      row('Растений', lsInfo.plants, lsInfo.plants?'ok':'bad')+
      row('Записей', lsInfo.records, lsInfo.records?'ok':'bad')+
      (lsInfo.err?row('Ошибка', lsInfo.err, 'bad'):'')+
      (lsInfo.names?('<div class="note">'+esc(lsInfo.names)+'</div>'):'')+
      '</div>');
  if(lsInfo.ok && lsInfo.plants) RECOVER={raw:ls,info:lsInfo};

  if(!CS){
    add('<div class="box"><h2>Облако недоступно</h2><div class="note">Открой эту страницу через бота в телеграме, а не в браузере.</div></div>');
    return done(parts);
  }

  /* ---- что вообще лежит в облаке ---- */
  const keys=await csKeys();
  const main=keys.filter(k=>k===KEY+'_n'||/^plants_\d+$/.test(k)).sort();
  const photo=keys.filter(k=>/^ph_/.test(k));
  const other=keys.filter(k=>main.indexOf(k)<0 && photo.indexOf(k)<0);
  add('<div class="box"><h2>Ячейки в облаке</h2>'+
      row('Всего', keys.length+' из 1024', keys.length>=1000?'bad':(keys.length>900?'warn':'ok'))+
      row('Основные данные', main.length, main.length?'ok':'bad')+
      row('Фото', photo.length, '')+
      row('Прочее', other.length, '')+
      (keys.length?('<pre>'+esc(keys.slice(0,120).join('  '))+(keys.length>120?' …':'')+'</pre>'):'')+
      '</div>');

  /* ---- собираем основные данные ---- */
  const nRaw=await csGet(KEY+'_n');
  const n=parseInt(nRaw||'0',10);
  let s='', missing=[];
  for(let i=0;i<n;i++){
    const v=await csGet(KEY+'_'+i);
    if(v==null||v==='') missing.push(i);
    s+=(v||'');
  }
  const cloudInfo=describe(s,'cloud');

  /* ---- ищем «хвосты»: куски за пределами счётчика ---- */
  let extra=0, sExtra=s;
  for(let i=n;i<n+40;i++){
    if(keys.indexOf(KEY+'_'+i)<0) break;
    const v=await csGet(KEY+'_'+i);
    if(v==null) break;
    sExtra+=v; extra++;
  }
  const extraInfo=extra?describe(sExtra,'cloud+хвосты'):null;

  add('<div class="box"><h2>Основные данные в облаке</h2>'+
      row('Счётчик кусков', nRaw==null?'нет':nRaw, n?'ok':'bad')+
      row('Собрано символов', cloudInfo.len, cloudInfo.len?'ok':'bad')+
      row('Пустых кусков', missing.length?missing.join(', '):'нет', missing.length?'bad':'ok')+
      row('Разбирается', cloudInfo.ok?'да':'НЕТ', cloudInfo.ok?'ok':'bad')+
      row('Растений', cloudInfo.plants, cloudInfo.plants?'ok':'bad')+
      row('Записей', cloudInfo.records, cloudInfo.records?'ok':'bad')+
      (cloudInfo.err?row('Ошибка', cloudInfo.err, 'bad'):'')+
      (cloudInfo.names?('<div class="note">'+esc(cloudInfo.names)+'</div>'):'')+
      (extra?row('Лишних кусков за счётчиком', extra, 'warn'):'')+
      (extraInfo?row('С ними разбирается', extraInfo.ok?('да — растений '+extraInfo.plants):'нет', extraInfo.ok?'ok':'bad'):'')+
      (cloudInfo.len?('<pre>'+esc(s.slice(0,300))+'…</pre>'):'')+
      '</div>');

  /* лучший кандидат на восстановление */
  const cands=[];
  if(extraInfo && extraInfo.ok && extraInfo.plants) cands.push({raw:sExtra,info:extraInfo});
  if(cloudInfo.ok && cloudInfo.plants) cands.push({raw:s,info:cloudInfo});
  if(lsInfo.ok && lsInfo.plants) cands.push({raw:ls,info:lsInfo});
  cands.sort((a,b)=>(b.info.records-a.info.records)||(b.info.plants-a.info.plants));
  RECOVER=cands[0]||null;

  done(parts);
})().catch(e=>{
  $('#out').innerHTML='<div class="box"><h2 class="bad">Сбой проверки</h2><pre>'+esc(e&&e.message)+'</pre></div>';
});

function row(k,v,cls){ return '<div class="row"><span>'+esc(k)+'</span><b class="'+(cls||'')+'">'+esc(v)+'</b></div>'; }

function done(parts){
  if(RECOVER){
    parts.push('<div class="box"><h2 class="ok">Данные найдены</h2>'+
      row('Откуда', RECOVER.info.where, 'ok')+
      row('Растений', RECOVER.info.plants, 'ok')+
      row('Записей', RECOVER.info.records, 'ok')+
      '<div class="note">Можно вернуть их в приложение. Кнопка запишет найденный набор обратно в облако.</div>'+
      '<button class="go" id="fix">Вернуть эти данные</button></div>');
  } else {
    parts.push('<div class="box"><h2 class="bad">Готового набора не нашлось</h2>'+
      '<div class="note">Пришли снимок этого экрана — по цифрам выше будет видно, что уцелело.</div></div>');
  }
  parts.push('<div class="box"><button class="ghost" id="copy">Скопировать отчёт</button></div>');
  $('#out').innerHTML=parts.join('');

  const fix=$('#fix');
  if(fix) fix.onclick=async()=>{
    fix.disabled=true; fix.textContent='Возвращаю…';
    const raw=RECOVER.raw, CHUNK=3500;
    try{ localStorage.setItem(KEY,raw); }catch(e){}
    if(CS){
      const ps=[]; for(let i=0;i<raw.length;i+=CHUNK) ps.push(raw.slice(i,i+CHUNK));
      for(let i=0;i<ps.length;i++){ await new Promise(r=>{ try{ CS.setItem(KEY+'_'+i,ps[i],()=>r()); }catch(e){ r(); } }); }
      await new Promise(r=>{ try{ CS.setItem(KEY+'_n',String(ps.length),()=>r()); }catch(e){ r(); } });
    }
    fix.textContent='Готово — открой приложение';
    fix.className='ghost';
  };
  $('#copy').onclick=()=>{
    const t=document.body.innerText;
    try{ navigator.clipboard.writeText(t); }catch(e){}
    $('#copy').textContent='Скопировано';
  };
}
</script>
</body>
</html>
