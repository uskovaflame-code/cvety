<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ботаник · Моя оранжерея</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ===== СВЕТЛАЯ ТЕМА (по умолчанию) ===== */
:root{
  --bg:#EAF1E8;
  --bg-2:#DFE9DA;
  --ink:#12291D;
  --ink-2:#5C7565;
  --ink-3:#93A899;
  --green:#2C6E49;
  --water:#2F9089;
  --water-ink:#1F7B74;
  --feed:#B8811F;
  --feed-ink:#8E6415;
  --line:rgba(18,41,29,.08);

  /* поверхности */
  --g-card:linear-gradient(168deg,#FFFFFF 0%,#FBFDFA 58%,#F4F9F2 100%);
  --g-glass:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,255,255,.82));
  --g-tile:linear-gradient(160deg,#F3F8F1 0%,#E8F1E5 100%);
  --g-green:linear-gradient(150deg,#4CA372 0%,#2C6E49 46%,#1D5238 100%);
  --g-water:linear-gradient(150deg,#EDF9F7 0%,#D2EBE7 100%);
  --g-feed:linear-gradient(150deg,#FCF3E1 0%,#F2E2C2 100%);
  --g-soft:linear-gradient(150deg,#E4F1E6,#CFE4D5);
  --g-avatar:linear-gradient(150deg,#E9F5EB 0%,#CFE6D6 100%);
  --g-seg:linear-gradient(160deg,#DCE7D7,#D2E0CD);
  --g-track:linear-gradient(160deg,#E2EBE0,#D5E1D2);
  --g-cell:linear-gradient(150deg,#DEF0E2,#C7E2CF);
  --g-sheet:linear-gradient(180deg,#F3F8F1 0%,#EAF1E8 22%);
  --g-danger:linear-gradient(150deg,#F8E7E3,#EFD6D0);
  --danger-ink:#A8493A;
  --g-title:linear-gradient(120deg,#12291D 20%,#2C6E49 78%,#2F9089 100%);
  --g-days:linear-gradient(140deg,#2C6E49,#2F9089);
  --g-moist:linear-gradient(120deg,#2F9089 0%,#4FB08C 55%,#7ECBA0 100%);
  --g-dry:linear-gradient(120deg,#C6A97A 0%,#DBC59A 100%);
  --dry-ink:#9C7433;
  --hero-glow:radial-gradient(circle,rgba(126,203,160,.4) 0%,rgba(126,203,160,0) 70%);

  /* свет и тени */
  --hi:rgba(255,255,255,.9);
  --hi-soft:rgba(255,255,255,.55);
  --edge:rgba(18,41,29,.035);
  --glow:
    radial-gradient(90% 55% at 12% -8%, rgba(126,203,160,.42) 0%, rgba(126,203,160,0) 62%),
    radial-gradient(70% 45% at 100% 4%, rgba(101,190,186,.32) 0%, rgba(101,190,186,0) 60%),
    radial-gradient(120% 60% at 50% 108%, rgba(44,110,73,.14) 0%, rgba(44,110,73,0) 70%);
  --sh-card:0 1px 2px rgba(18,41,29,.04), 0 10px 24px -12px rgba(18,41,29,.22), 0 28px 48px -28px rgba(18,41,29,.28);
  --sh-raise:inset 0 1px 0 var(--hi-soft), 0 1px 2px rgba(18,41,29,.08), 0 8px 16px -8px rgba(18,41,29,.28);
  --sh-green:inset 0 1px 0 rgba(255,255,255,.32), 0 2px 4px rgba(29,82,56,.22), 0 12px 22px -10px rgba(29,82,56,.62), 0 24px 40px -22px rgba(29,82,56,.5);
  --sh-press:inset 0 2px 6px rgba(18,41,29,.2);
  --sh-green-press:inset 0 2px 5px rgba(12,44,28,.35), 0 2px 6px -3px rgba(29,82,56,.5);
  --sh-inset:inset 0 2px 5px rgba(18,41,29,.13), inset 0 -1px 0 rgba(255,255,255,.5);
  --sh-pill:inset 0 1px 0 var(--hi), 0 1px 2px rgba(18,41,29,.1), 0 6px 14px -8px rgba(18,41,29,.5);
  --scrim:rgba(14,34,24,.4);
  --top-fade:linear-gradient(180deg,#EAF1E8 62%,rgba(234,241,232,.86) 84%,rgba(234,241,232,0));
  --r:22px;
}

/* ===== ТЁМНАЯ ТЕМА ===== */
:root[data-theme="dark"]{
  --bg:#0D1613;
  --bg-2:#16211D;
  --ink:#E9F2EC;
  --ink-2:#A3B8AC;
  --ink-3:#71887C;
  --green:#54C68C;
  --water:#46C6BB;
  --water-ink:#7BDDD3;
  --feed:#E0B14F;
  --feed-ink:#EDC978;
  --line:rgba(255,255,255,.08);

  --g-card:linear-gradient(168deg,rgba(38,54,47,.94) 0%,rgba(26,39,34,.94) 62%,rgba(20,31,27,.96) 100%);
  --g-glass:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.045));
  --g-tile:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  --g-green:linear-gradient(150deg,#3FBE85 0%,#249662 48%,#146B44 100%);
  --g-water:linear-gradient(150deg,rgba(70,198,187,.26),rgba(70,198,187,.12));
  --g-feed:linear-gradient(150deg,rgba(224,177,79,.26),rgba(224,177,79,.11));
  --g-soft:linear-gradient(150deg,rgba(84,198,140,.24),rgba(84,198,140,.1));
  --g-avatar:linear-gradient(150deg,rgba(84,198,140,.3),rgba(30,74,55,.65));
  --g-seg:linear-gradient(160deg,rgba(0,0,0,.36),rgba(0,0,0,.22));
  --g-track:linear-gradient(160deg,rgba(0,0,0,.42),rgba(0,0,0,.26));
  --g-cell:linear-gradient(150deg,rgba(84,198,140,.3),rgba(84,198,140,.14));
  --g-sheet:linear-gradient(180deg,#1A2621 0%,#101B17 26%);
  --g-danger:linear-gradient(150deg,rgba(214,106,88,.26),rgba(214,106,88,.12));
  --danger-ink:#F09E8B;
  --g-title:linear-gradient(120deg,#EAF4EE 15%,#7BE0A9 70%,#5FD9CD 100%);
  --g-days:linear-gradient(140deg,#7BE0A9,#5FD9CD);
  --g-moist:linear-gradient(120deg,#3FC0B4 0%,#4FD79B 55%,#8BF0B8 100%);
  --g-dry:linear-gradient(120deg,#9C7C4A 0%,#C7A468 100%);
  --dry-ink:#D3AE72;
  --hero-glow:radial-gradient(circle,rgba(84,198,140,.28) 0%,rgba(84,198,140,0) 70%);

  --hi:rgba(255,255,255,.13);
  --hi-soft:rgba(255,255,255,.08);
  --edge:rgba(255,255,255,.07);
  --glow:
    radial-gradient(85% 50% at 10% -6%, rgba(46,168,116,.34) 0%, rgba(46,168,116,0) 64%),
    radial-gradient(70% 45% at 102% 2%, rgba(38,150,150,.3) 0%, rgba(38,150,150,0) 62%),
    radial-gradient(130% 65% at 50% 112%, rgba(28,102,72,.4) 0%, rgba(28,102,72,0) 72%);
  --sh-card:0 1px 2px rgba(0,0,0,.5), 0 14px 30px -16px rgba(0,0,0,.85), 0 34px 60px -34px rgba(0,0,0,.9);
  --sh-raise:inset 0 1px 0 var(--hi), 0 1px 2px rgba(0,0,0,.5), 0 10px 20px -10px rgba(0,0,0,.85);
  --sh-green:inset 0 1px 0 rgba(255,255,255,.26), 0 2px 5px rgba(0,0,0,.45), 0 14px 26px -12px rgba(20,107,68,.9), 0 26px 46px -24px rgba(0,0,0,.7);
  --sh-press:inset 0 2px 8px rgba(0,0,0,.6);
  --sh-green-press:inset 0 3px 8px rgba(0,0,0,.55), 0 2px 6px -3px rgba(0,0,0,.6);
  --sh-inset:inset 0 2px 6px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05);
  --sh-pill:inset 0 1px 0 var(--hi), 0 2px 4px rgba(0,0,0,.5), 0 8px 18px -9px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.62);
  --top-fade:linear-gradient(180deg,#0D1613 62%,rgba(13,22,19,.86) 84%,rgba(13,22,19,0));
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  position:relative;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
  transition:background .3s,color .3s;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--glow)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;position:relative}
h1,h2,h3{margin:0;font-family:ui-serif,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.02em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);width:100%}

/* шапка */
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
  background:var(--top-fade);backdrop-filter:blur(6px);
}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-actions{display:flex;gap:8px;flex:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.top h1{
  font-size:28px;line-height:1.1;
  background:var(--g-title);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.iconbtn{
  width:44px;height:44px;border-radius:50%;flex:none;
  background:var(--g-glass);box-shadow:var(--sh-raise);
  display:grid;place-items:center;font-size:20px;color:var(--green);
  transition:transform .12s,box-shadow .12s;
}
.iconbtn:active{transform:translateY(2px) scale(.97);box-shadow:var(--sh-press)}

/* переключатель дом / студия */
.seg{display:flex;gap:4px;padding:5px;border-radius:18px;background:var(--g-seg);box-shadow:var(--sh-inset);margin:2px 0 14px}
.seg button{
  flex:1;padding:10px 6px;border-radius:14px;font-size:14px;font-weight:600;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .14s,box-shadow .18s,color .18s;
}
.seg button.on{background:var(--g-glass);color:var(--green);box-shadow:var(--sh-pill)}
.seg button i{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:600}
.seg button.on i{color:var(--green);opacity:.65}
.gtag{
  display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;background:var(--g-soft);color:var(--green);font-weight:600;
  box-shadow:inset 0 1px 0 var(--hi);margin-bottom:6px;
}

/* чипы */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--g-glass);font-size:13px;color:var(--ink-2);box-shadow:var(--sh-pill);
}
.chip b{color:var(--ink);font-weight:600}
.chip.alarm{background:var(--g-water);color:var(--water-ink)}
.chip.alarm b{color:var(--water-ink)}

/* карточка растения */
.card{
  position:relative;background:var(--g-card);border-radius:var(--r);box-shadow:var(--sh-card);
  padding:16px 16px 14px;margin-bottom:14px;overflow:hidden;
  transition:transform .14s,box-shadow .14s;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--edge);
}
.card:active{transform:translateY(2px)}
.card-head{display:flex;gap:13px;align-items:flex-start}
.avatar{
  width:80px;height:80px;border-radius:22px;flex:none;background:var(--g-avatar);
  display:grid;place-items:center;font-size:38px;
  box-shadow:inset 0 1px 0 var(--hi), 0 6px 12px -8px rgba(0,0,0,.6);
}
.pname{font-family:ui-serif,Georgia,serif;font-size:19px;font-weight:600;letter-spacing:-.01em}
.psub{font-size:13px;color:var(--ink-3);margin-top:1px}
.pstate{margin-left:auto;text-align:right;flex:none}
.days{
  font-size:22px;font-family:ui-serif,Georgia,serif;line-height:1.1;
  background:var(--g-days);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.dayslab{font-size:11px;color:var(--ink-3);letter-spacing:.04em}

/* полоска влаги */
.moist{margin-top:14px}
.moist-track{height:11px;border-radius:99px;background:var(--g-track);box-shadow:var(--sh-inset);overflow:hidden}
.moist-fill{
  height:100%;border-radius:99px;background:var(--g-moist);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 14px rgba(70,198,187,.55);
  transition:width .5s ease;
}
.moist-fill.low{background:var(--g-dry);box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 12px rgba(198,169,122,.45)}
.moist-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--ink-3)}
.moist-meta .now{color:var(--water);font-weight:600}
.moist-meta .now.low{color:var(--dry-ink)}

/* объёмные кнопки действий */
.quick{display:flex;gap:10px;margin-top:14px}
.qbtn{
  flex:1;padding:12px 8px;border-radius:16px;text-align:center;font-size:14px;font-weight:600;
  color:var(--water-ink);background:var(--g-water);
  box-shadow:inset 0 1px 0 var(--hi), 0 2px 3px rgba(0,0,0,.12), 0 10px 18px -10px rgba(47,144,137,.75);
  transition:transform .12s,box-shadow .12s;
}
.qbtn.feed{color:var(--feed-ink);background:var(--g-feed);box-shadow:inset 0 1px 0 var(--hi), 0 2px 3px rgba(0,0,0,.12), 0 10px 18px -10px rgba(184,129,31,.7)}
.qbtn:active{transform:translateY(3px);box-shadow:var(--sh-press)}

/* выбор нескольких растений */
.tools{display:flex;justify-content:flex-end;margin:-6px 0 12px}
.linkbtn{
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
  color:var(--green);background:var(--g-glass);box-shadow:var(--sh-pill);
  transition:transform .12s,box-shadow .12s;
}
.linkbtn:active{transform:translateY(2px);box-shadow:var(--sh-press)}
.linkbtn.off{color:var(--ink-2)}
.card.picked{box-shadow:var(--sh-card), 0 0 0 2px var(--green)}
.selmark{
  position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;z-index:2;
  display:grid;place-items:center;font-size:14px;color:transparent;
  background:var(--g-tile);box-shadow:inset 0 0 0 1.5px var(--line);
}
.card.picked .selmark{background:var(--g-green);color:#fff;box-shadow:var(--sh-green)}
.bulkbar{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--g-sheet);box-shadow:0 -10px 30px -12px rgba(0,0,0,.5);
}
.bulkbar-in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bulkbar .cnt{flex:1;font-size:14px;color:var(--ink-2)}
.bulkbar .cnt b{color:var(--ink);font-weight:600}
.bulkbar .go{
  flex:1;padding:14px;border-radius:18px;background:var(--g-green);color:#fff;
  font-weight:600;font-size:14px;box-shadow:var(--sh-green);
  transition:transform .12s,box-shadow .12s;
}
.bulkbar .go:active{transform:translateY(3px);box-shadow:var(--sh-green-press)}
.bulkbar .go[disabled]{opacity:.4;box-shadow:none}
body.bulk{padding-bottom:calc(130px + env(safe-area-inset-bottom))}

/* сохранённые подкормки */
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.fchip{
  display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
  font-size:13px;color:var(--ink-2);background:var(--g-glass);box-shadow:var(--sh-pill);
  transition:transform .12s;
}
.fchip.on{color:var(--feed-ink);background:var(--g-feed)}
.fchip:active{transform:translateY(2px)}
.fchip .x{font-size:16px;color:var(--ink-3);line-height:1;padding:0 2px}
.fhint{font-size:12px;color:var(--ink-3);margin-top:8px}

/* фото растения */
.avatar.photo{background-size:cover;background-position:center;font-size:0}
.hero-photo{
  margin:-20px -20px 16px;height:170px;position:relative;
  background-size:cover;background-position:center;background-color:var(--g-tile);
}
.hero-photo::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -46px 56px -34px rgba(0,0,0,.5)}
.photorow{display:flex;gap:11px;align-items:center}
.photoprev{
  width:72px;height:72px;border-radius:22px;flex:none;
  background:var(--g-avatar);background-size:cover;background-position:center;
  display:grid;place-items:center;font-size:30px;
  box-shadow:inset 0 1px 0 var(--hi), 0 6px 12px -8px rgba(0,0,0,.6);
}
.photoprev.has{font-size:0}
.photobtns{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.photobtn{
  padding:11px 14px;border-radius:15px;font-size:13px;font-weight:600;
  color:var(--ink-2);background:var(--g-tile);box-shadow:var(--sh-raise);
  transition:transform .12s,box-shadow .12s;
}
.photobtn.main{color:var(--green)}
.photobtn:active{transform:translateY(2px);box-shadow:var(--sh-press)}
.photonote{font-size:12px;color:var(--ink-3);margin-top:8px}

/* пустой экран */
.empty{background:var(--g-card);border-radius:var(--r);box-shadow:var(--sh-card);padding:36px 24px;text-align:center}
.empty .leaf{font-size:42px;filter:drop-shadow(0 8px 14px rgba(31,92,66,.4))}
.empty h3{font-size:19px;margin:10px 0 6px}
.empty p{margin:0;color:var(--ink-2);font-size:14px}

.addbtn{
  width:100%;padding:16px;border-radius:20px;margin:6px 0 8px;
  background:var(--g-green);color:#fff;font-weight:600;font-size:15px;letter-spacing:.01em;
  box-shadow:var(--sh-green);transition:transform .12s,box-shadow .12s;
}
.addbtn:active{transform:translateY(3px);box-shadow:var(--sh-green-press)}
.rows{margin-bottom:14px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
      border-bottom:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.drow:last-child{border-bottom:0}
.drow b{color:var(--ink);font-weight:600;text-align:right}
.drow b.warn{color:var(--feed-ink)}
.drow b.bad{color:var(--danger-ink)}
.ghostbtn{
  width:100%;padding:14px;border-radius:18px;margin-top:10px;
  background:var(--g-tile);color:var(--ink-2);font-weight:600;font-size:14px;
  box-shadow:var(--sh-raise);transition:transform .12s,box-shadow .12s;
}
.ghostbtn:active{transform:translateY(2px);box-shadow:var(--sh-press)}

/* экран растения */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);padding:6px 2px}
.hero{position:relative;background:var(--g-card);border-radius:26px;box-shadow:var(--sh-card);padding:20px;margin-bottom:14px;overflow:hidden}
.hero::before{
  content:"";position:absolute;top:-70px;right:-50px;width:210px;height:210px;border-radius:50%;
  background:var(--hero-glow);pointer-events:none;
}
.hero-top{display:flex;gap:14px;align-items:center;position:relative}
.hero .avatar{width:58px;height:58px;border-radius:20px;font-size:29px}
.hero h2{font-size:24px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative}
.stat{background:var(--g-tile);border-radius:18px;padding:13px 14px;box-shadow:inset 0 1px 0 var(--hi), 0 6px 14px -10px rgba(0,0,0,.7)}
.stat .v{font-family:ui-serif,Georgia,serif;font-size:20px;line-height:1.2}
.stat .l{font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-top:2px}

.block{background:var(--g-card);border-radius:var(--r);box-shadow:var(--sh-card);padding:18px;margin-bottom:14px}
.block h3{font-size:16px;margin-bottom:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:12px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.w{background:var(--water)}
.dot.f{background:var(--feed)}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:10px;color:var(--ink-3);padding-bottom:4px;letter-spacing:.06em}
.cell{
  aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;color:var(--ink-2);background:var(--g-tile);box-shadow:inset 0 1px 0 var(--hi-soft);
}
.cell.blank{background:none;box-shadow:none}
.cell.today{box-shadow:inset 0 0 0 1.5px var(--green), inset 0 1px 0 var(--hi-soft);color:var(--green);font-weight:600}
.cell.has{background:var(--g-cell);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi), 0 4px 10px -7px rgba(0,0,0,.8)}
.cell.has.today{box-shadow:inset 0 0 0 1.5px var(--green), 0 4px 10px -7px rgba(0,0,0,.8)}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:5px;height:5px;border-radius:50%;display:block}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calnav .m{font-size:14px;font-weight:600}
.calnav button{padding:6px 12px;border-radius:12px;background:var(--g-tile);color:var(--ink-2);font-size:15px;box-shadow:var(--sh-raise)}
.calnav button:active{transform:translateY(2px);box-shadow:var(--sh-press)}

/* списки */
.rowlist{display:flex;flex-direction:column;gap:11px}
.row{display:flex;gap:12px;align-items:flex-start;padding-bottom:11px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:0}
.rdate{font-size:12px;color:var(--ink-3);width:58px;flex:none;padding-top:3px}
.rmain{flex:1;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600;
  background:var(--g-water);color:var(--water-ink);box-shadow:inset 0 1px 0 var(--hi);
}
.tag.feed{background:var(--g-feed);color:var(--feed-ink)}
.tag.other{background:var(--g-soft);color:var(--green)}
.rnote{font-size:13px;color:var(--ink-2);margin-top:5px;word-break:break-word}
.rfert{font-size:13px;color:var(--feed-ink);margin-top:4px}
.del{color:var(--ink-3);font-size:17px;padding:2px 4px;flex:none}
.bar{height:9px;border-radius:99px;background:linear-gradient(90deg,var(--feed),var(--feed-ink));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.fert-row{display:flex;align-items:center;gap:10px;font-size:14px}
.fert-row .n{width:24px;text-align:right;color:var(--ink-3);font-size:13px;flex:none}
.fert-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fert-row .track{width:88px;flex:none;border-radius:99px;overflow:hidden;background:var(--g-track);box-shadow:var(--sh-inset)}

/* шторки */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--g-sheet);
  border-radius:28px 28px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;
  box-shadow:inset 0 1px 0 var(--hi), 0 -20px 50px -20px rgba(0,0,0,.6);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-width:520px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--ink-3);opacity:.4;margin:6px auto 16px}
.sheet h3{font-size:20px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:7px}
.field input,.field textarea,.field select{
  background:var(--g-glass);border:1px solid transparent;border-radius:16px;padding:13px 14px;outline:none;
  box-shadow:inset 0 1px 0 var(--hi), 0 4px 10px -8px rgba(0,0,0,.7);
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--green);
  box-shadow:inset 0 1px 0 var(--hi), 0 0 0 4px rgba(84,198,140,.16);
}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-3)}
.field textarea{min-height:76px;resize:vertical}
.two{display:flex;gap:10px}
.two .field{flex:1}
.picker{display:flex;gap:8px;flex-wrap:wrap}
.pick{
  padding:10px 13px;border-radius:16px;background:var(--g-glass);font-size:20px;line-height:1;
  border:1.5px solid transparent;box-shadow:var(--sh-raise);transition:transform .12s,box-shadow .12s;
}
.pick.on{border-color:var(--green);background:var(--g-soft);box-shadow:inset 0 1px 0 var(--hi), 0 6px 14px -8px rgba(0,0,0,.7)}
.pick:active{transform:translateY(2px)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{
  padding:13px;border-radius:18px;background:var(--g-glass);border:1.5px solid transparent;
  font-size:14px;font-weight:600;color:var(--ink-2);text-align:center;
  box-shadow:var(--sh-raise);transition:transform .12s,box-shadow .12s,color .18s;
}
.type.on{border-color:var(--green);color:var(--green);background:var(--g-soft);box-shadow:inset 0 1px 0 var(--hi), 0 8px 16px -9px rgba(0,0,0,.8)}
.type:active{transform:translateY(2px)}
.danger{
  width:100%;padding:14px;border-radius:18px;margin-top:10px;
  background:var(--g-danger);color:var(--danger-ink);font-weight:600;font-size:14px;
  box-shadow:inset 0 1px 0 var(--hi), 0 8px 16px -10px rgba(0,0,0,.7);
}
.danger:active{transform:translateY(2px);box-shadow:var(--sh-press)}

/* тост */
.lockbar{
  position:fixed;left:0;right:0;top:0;z-index:95;
  padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
  background:linear-gradient(150deg,#F8E7E3,#EFD6D0);color:#8A3A2C;
  box-shadow:0 10px 28px -12px rgba(0,0,0,.5);font-size:13px;line-height:1.45;
}
.lockbar-in{max-width:520px;margin:0 auto}
.lockbtn{
  width:100%;margin-top:10px;padding:12px;border-radius:14px;
  background:#A8493A;color:#fff;font-weight:600;font-size:13px;
}
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--g-green);color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;z-index:80;
  box-shadow:0 12px 28px -10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.28);
  opacity:0;pointer-events:none;transition:all .25s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

:root[data-theme="light"] body::before {opacity:.10}
.wrap,.top-in {max-width:580px}
.top {padding:calc(18px + env(safe-area-inset-top)) 20px 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);margin-bottom:22px}
.brandline {display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
.brandline svg {width:19px;height:19px}
.eyebrow {font-size:11px;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
.top .eyebrow {display:none}
.top h1 {font-size:32px;font-weight:400;line-height:1.12;letter-spacing:-.04em}
.top-actions {align-self:center;gap:8px}
.iconbtn {width:42px;height:42px;border:1px solid var(--line);font-size:22px}
.wrap {padding:0 20px}
.seg {border:1px solid var(--line);padding:4px;border-radius:18px;margin:0 0 18px;box-shadow:none}
.seg button {min-height:44px;font-weight:500;border-radius:13px}
.seg button.on {background:var(--g-green);color:#19351e;box-shadow:none}
.seg button.on i {color:#38502a;opacity:1}
.summary {background:var(--g-card);border:1px solid var(--line);border-radius:24px;padding:19px;margin-bottom:22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.summary-heading {display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.summary-heading h2 {font-size:23px;font-weight:400}
.summary-heading span {font-size:12px;color:var(--ink-2)}
.summary-grid {display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item {display:flex;align-items:center;gap:12px;text-align:left;min-height:78px;padding:12px;border:1px solid var(--line);border-radius:17px;background:var(--g-water)}
.summary-item.feed {background:var(--g-feed)}
.summary-item svg {width:25px;height:30px;flex:none;color:var(--water-ink)}
.summary-item.feed svg {color:var(--feed-ink)}
.summary-number {display:block;font:32px/1.1 Georgia,serif;color:var(--ink)}
.summary-item small {display:block;color:var(--ink-2);font-size:12px;margin-top:3px}
.summary-caption {margin:12px 0 0;color:var(--ink-3);font-size:11px}
.list-heading {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.list-heading h2 {font-size:23px;font-weight:400}
.list-heading span {font-size:12px;color:var(--ink-3)}
.list-heading {flex-wrap:wrap}
.list-heading .tools {width:100%;margin:0;justify-content:flex-start}
.list-heading .linkbtn {padding:4px 0;background:none;border:0;min-height:28px}
.list-heading h2 {font-size:22px}
#chips {display:none}
.chips {gap:6px;margin-bottom:14px}
.chip {box-shadow:none;border:1px solid var(--line);padding:6px 10px;font-size:11px}
.tools {margin:0 0 12px}
.linkbtn {font-weight:500;font-size:12px;min-height:36px;border:1px solid var(--line)}
.card,.block,.hero,.empty {border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:23px}
.card {padding:16px;margin-bottom:14px}
.card::after {display:none}
.card-head {display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:center}
.avatar {width:82px;height:94px;border-radius:15px;background:var(--g-tile);border:1px solid var(--line);box-shadow:none;font-size:34px}
.avatar svg {width:34px;height:34px;color:var(--green)}
.pname {font-size:21px;font-weight:400;line-height:1.16;overflow-wrap:anywhere}
.psub {font-size:12px;line-height:1.6;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.pstate {grid-column:2;text-align:left;margin: -4px 0 0;display:flex;align-items:baseline;gap:6px}
.days {font:14px/1.2 system-ui,sans-serif;color:var(--green);background:none}
.dayslab {font-size:11px;letter-spacing:0}
.moist {margin-top:14px}
.moist-track {height:5px;box-shadow:none}
.moist-fill {box-shadow:none}
.moist-meta {font-size:11px;margin-top:7px}
.quick {gap:9px;margin-top:14px}
.qbtn,.qbtn.feed {min-height:47px;padding:12px 7px;border-radius:13px;font-size:13px;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:7px}
.qbtn {background:var(--g-green);color:#18331e}
.qbtn.feed {background:var(--g-feed);color:var(--feed-ink);border:1px solid var(--line)}
.qbtn svg {width:17px;height:19px;flex:none}
.addbtn,.bulkbar .go,.card.picked .selmark,.toast {color:#19351e}
.addbtn {border-radius:16px;min-height:50px}
.ghostbtn {border:1px solid var(--line);box-shadow:none;border-radius:15px}
.bottom-nav {position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:540px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--g-sheet);border:1px solid var(--line);border-radius:23px;z-index:30;padding:6px;box-shadow:0 10px 35px #0005}
.bottom-nav button {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:58px;border-radius:17px;color:var(--ink-2);font-size:10px}
.bottom-nav button.active {background:var(--g-soft);color:var(--green)}
.bottom-nav svg {width:21px;height:21px}
body.bulk .bottom-nav {display:none}
.back {min-height:44px;margin-bottom:10px}
.hero {padding:20px}
.hero-photo {height:290px;margin:-20px -20px 22px}
.hero-top .avatar {width:50px;height:58px;font-size:25px}
.hero h2 {font-size:29px;font-weight:400;line-height:1.15;overflow-wrap:anywhere}
.hero .quick {margin-top:20px}
.stats {gap:8px}
.stat {border:1px solid var(--line);border-radius:14px;padding:13px 11px;box-shadow:none}
.stat .v {font-weight:400;font-size:22px}
.stat .l {font-size:10px;line-height:1.5}
.block h3 {font-size:22px;font-weight:400}
.block {padding:19px}
.row {gap:10px}
.journal-plant {display:block;text-align:left;font:19px/1.3 Georgia,serif;padding:0 0 7px;color:var(--green)}
.journal-heading {font-size:13px;color:var(--ink-2);margin:4px 0 20px}
.journal-rows .row {padding:16px 0}
.journal-rows .rdate {width:53px}
.sheet {max-width:580px;border:1px solid var(--line);border-bottom:0;border-radius:27px 27px 0 0;padding-left:22px;padding-right:22px}
.sheet:not(.on) {visibility:hidden}
.sheet.on {visibility:visible}
.sheet h3 {font-size:28px;font-weight:400}
.field input,.field textarea {border-color:var(--line);box-shadow:none;border-radius:13px}
.field label {font-size:11px;color:var(--ink-2)}
.type,.pick {box-shadow:none;border-color:var(--line)}
.toast {bottom:calc(100px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 32px);text-align:center;border-radius:16px}
.sheet-close {float:right;margin-top:3px;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;font-size:22px;color:var(--ink-2)}
button:focus-visible,[role="button"]:focus-visible {outline:2px solid var(--green);outline-offset:4px}
button {touch-action:manipulation}
@media(min-width:700px) {.top {padding-top:25px}.top h1 {font-size:37px}.wrap {padding:0 22px}.hero-photo {height:340px}}
@media(max-width:359px) {.wrap {padding:0 12px}.top {padding-left:14px;padding-right:14px}.top h1 {font-size:27px}.summary {padding:14px}.summary-item {padding:10px;gap:8px}.summary-item small {font-size:11px}.card {padding:12px}.pname {font-size:19px}.qbtn {font-size:12px}.top-actions {gap:5px}.iconbtn {width:37px;height:37px}.two {flex-direction:column;gap:0}}
@media(prefers-reduced-motion:reduce) {html {scroll-behavior:auto}}

/* Exact composition of the approved two-screen concept, at a 390px content width. */
:root[data-theme="dark"] {

 --g-card:linear-gradient(125deg,rgba(121,142,82,.27),rgba(21,50,29,.56));
 --g-sheet:linear-gradient(145deg,#32482c,#102b1d);
 --g-feed:linear-gradient(120deg,rgba(174,203,118,.14),rgba(23,54,29,.32));
 --sh-card:inset 0 1px 0 #f3f8cf12,0 3px 12px #0002;
}

h1,h2,h3,.pname,.summary-number {font-family:"Times New Roman",Times,serif!important;font-weight:400!important;letter-spacing:0}
.wrap {max-width:430px;padding:0 13px}
.top {position:relative;top:auto!important;margin:0;padding:25px 13px 19px;background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.top-in {max-width:404px;position:relative;justify-content:center;align-items:center;min-height:42px}
.top h1 {font-size:43px;line-height:1;color:var(--ink);background:none;letter-spacing:-1px;font-weight:400}
.brandline,.top-actions,.top .eyebrow {display:none}
.reference-settings {position:absolute;right:2px;top:7px;width:29px;height:30px;padding:3px;color:var(--ink-2)}
.reference-settings svg {width:24px;height:24px}
.location-row {display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 0 15px}
.location-row h2 {font-size:23px;line-height:1.05;margin:0 0 7px;white-space:nowrap}
.location-row #totalPlants {font-size:13px;color:var(--ink-2)}
.location-row .seg {margin:0;flex:none;gap:0;padding:2px;border-radius:25px;background:rgba(160,186,134,.09);box-shadow:inset 0 1px 0 #ffffff0c}
.location-row .seg button {padding:8px 12px;font-size:12px;min-height:36px;gap:7px;font-weight:400;border-radius:24px}
.location-row .seg svg {width:14px;height:16px}
.location-row .seg .reference-all {display:none}
.location-row .seg button.on {font-weight:600;box-shadow:0 0 7px #d4f19a33}
.summary {padding:12px 11px 10px;border-radius:16px;margin:0 0 13px;background:var(--g-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-card)}
.summary-heading {margin:0 0 12px}
.summary-heading h2 {font:20px Arial,sans-serif!important}
.summary-heading>span {display:none}
.summary-grid {gap:9px}
.summary-item {position:relative;min-height:92px;padding:11px 10px;align-items:flex-start;gap:10px;background:linear-gradient(125deg,#d3e7a511,#0a2b1826);border:1px solid var(--line);border-radius:13px;box-shadow:inset 0 1px 0 #f8ffe80c}
.summary-item.feed {background:linear-gradient(125deg,#d3e7a511,#0a2b1826)}

<body>

<div class="top">
  <div class="top-in">
    <div>
      <div class="eyebrow" id="today">—</div>
      <h1 id="title">Мои растения</h1>
    </div>
    <div class="top-actions">
      <button class="iconbtn" id="themeBtn" aria-label="Сменить тему">🌙</button>
      <button class="iconbtn" id="topAdd" aria-label="Добавить растение">+</button>
    </div>
  </div>
</div>

<!-- ЭКРАН: СПИСОК -->
<div class="wrap" id="screenHome">
  <div class="seg" id="seg"></div>
  <div class="chips" id="chips"></div>
  <div class="tools hidden" id="tools">
    <button class="linkbtn" id="selToggle">Отметить несколько</button>
  </div>
  <div id="list"></div>
  <button class="addbtn" id="addPlant">Добавить растение</button>
  <button class="ghostbtn" id="openData">Данные и копии</button>
</div>

<!-- ЭКРАН: РАСТЕНИЕ -->
<div class="wrap hidden" id="screenPlant"></div>

<!-- ПАНЕЛЬ ВЫБОРА НЕСКОЛЬКИХ -->
<div class="bulkbar hidden" id="bulkBar">
  <div class="bulkbar-in">
    <div class="cnt" id="selCnt">Выбрано <b>0</b></div>
    <button class="linkbtn" id="selAll">Выбрать все</button>
    <button class="linkbtn off" id="selCancel">Отмена</button>
  </div>
  <div class="bulkbar-in" style="margin-top:10px">
    <button class="go" id="selGo" disabled>Записать</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<!-- ФОРМА РАСТЕНИЯ -->
<div class="sheet" id="sheetPlant">
  <div class="grab"></div>
  <h3 id="plantSheetTitle">Новое растение</h3>
  <div class="field">
    <label>НАЗВАНИЕ</label>
    <input id="fName" placeholder="Фикус у окна" autocomplete="off">
  </div>
  <div class="field">
    <label>ФОТО (необязательно)</label>
    <div class="photorow">
      <div class="photoprev" id="fPhotoPrev">🪴</div>
      <div class="photobtns">
        <button type="button" class="photobtn main" id="fPhotoPick">Добавить фото</button>
        <button type="button" class="photobtn hidden" id="fPhotoDrop">Убрать фото</button>
      </div>
    </div>
    <div class="photonote">Фото уменьшится — так оно поместится в облако телеграма.</div>
    <input type="file" accept="image/*" id="fPhotoInput" style="display:none">
  </div>
  <div class="field">
    <label>ЗНАЧОК</label>
    <div class="picker" id="fEmoji"></div>
  </div>
  <div class="field">
    <label>ГДЕ ЖИВЁТ</label>
    <div class="seg" id="fGroup" style="margin:0"></div>
  </div>
  <div class="field">
    <label>ТОЧНОЕ МЕСТО (необязательно)</label>
    <input id="fPlace" placeholder="Спальня, южное окно" autocomplete="off">
  </div>
  <div class="two">
    <div class="field">
      <label>ПОЛИВ, РАЗ В … ДНЕЙ</label>
      <input id="fWater" type="number" min="1" max="120" value="7" inputmode="numeric">
    </div>
    <div class="field">
      <label>ПОДКОРМКА, РАЗ В … ДНЕЙ</label>
      <input id="fFeed" type="number" min="1" max="365" value="21" inputmode="numeric">
    </div>
  </div>
  <div class="field">
    <label>ЗАМЕТКА О РАСТЕНИИ (необязательно)</label>
    <textarea id="fNote" placeholder="Любит опрыскивание, боится сквозняка"></textarea>
  </div>
  <button class="addbtn" id="savePlant">Сохранить</button>
  <button class="danger hidden" id="deletePlant">Удалить растение</button>
</div>

<!-- ФОРМА ЗАПИСИ -->
<div class="sheet" id="sheetRec">
  <div class="grab"></div>
  <h3 id="recTitle">Запись</h3>
  <div class="field">
    <label>ЧТО СДЕЛАЛА</label>
    <div class="types" id="rTypes"></div>
  </div>
  <div class="field">
    <label>ДАТА</label>
    <input id="rDate" type="date">
  </div>
  <div class="field hidden" id="fertField">
    <label>ЧЕМ ПОДКОРМИЛА</label>
    <input id="rFert" placeholder="Bona Forte для декоративнолистных" autocomplete="off">
    <div class="fchips" id="fertChips"></div>
  </div>
  <div class="field">
    <label>ЗАМЕТКА (необязательно)</label>
    <textarea id="rNote" placeholder="Земля пересохла, полила обильно"></textarea>
  </div>
  <button class="addbtn" id="saveRec">Сохранить запись</button>
</div>

<div class="lockbar hidden" id="lockBar">
  <div class="lockbar-in">
    <div id="lockText">—</div>
    <button class="lockbtn hidden" id="lockBtn"></button>
  </div>
</div>

<!-- ДАННЫЕ И КОПИИ -->
<div class="sheet" id="sheetData">
  <div class="grab"></div>
  <h3>Данные и копии</h3>
  <div id="dataInfo" class="rows">Смотрю…</div>
  <button class="addbtn" id="bakNow">Сделать копию сейчас</button>
  <button class="ghostbtn" id="bakRestore">Восстановить из копии</button>
  <button class="ghostbtn" id="dataShow">Показать данные для переноса</button>
  <div class="field hidden" id="dumpField" style="margin-top:14px">
    <label>ВСЕ ТВОИ ЗАПИСИ</label>
    <textarea id="dumpText" readonly style="min-height:120px;font-size:11px"></textarea>
    <button class="ghostbtn" id="dumpCopy">Скопировать</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Telegram ---------- */
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (TG) { try { TG.ready(); TG.expand(); } catch(e){} }
function buzz(style){ try{ TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred(style||'light'); }catch(e){} }
function askConfirm(text){
  return new Promise(r=>{
    try{
      if(TG && TG.showConfirm){ TG.showConfirm(text,ok=>r(!!ok)); return; }
    }catch(e){}
    r(window.confirm(text));
  });
}

/* ---------- Хранилище: CloudStorage (у каждой свои данные) → localStorage → память ---------- */
const KEY='plants', CHUNK=3500, BAK='bak', BAKW='bakw';
const mem={};
const CS = TG && TG.CloudStorage && TG.CloudStorage.setItem ? TG.CloudStorage : null;

let READ_OK=true;      // удалось ли прочитать хранилище; пока false — не пишем НИЧЕГО
let CLOUD_N=0;         // сколько кусков лежало в облаке на старте
let LOADED_RAW='';     // что успешно прочитали — из этого делаем резервную копию
let BAK_OFFER=null;    // разобранная резервная копия, если основное не читается

function csGet(k){ return new Promise(r=>{ try{ CS.getItem(k,(e,v)=>r(e?null:v)); }catch(e){ r(null); } }); }
/* Запись в облако теперь честно сообщает, получилось или нет.
   Раньше ошибка проглатывалась молча — и данные могли уехать наполовину. */
function csSet(k,v){
  return new Promise(r=>{
    try{ CS.setItem(k,v,(e,ok)=>r(!e && ok!==false)); }catch(e){ r(false); }
  });
}
function cloudKeys(){
  if(!CS || typeof CS.getKeys!=='function') return Promise.resolve(null);
  return new Promise(r=>{ try{ CS.getKeys((e,v)=>r(e?null:(v||[]))); }catch(e){ r(null); } });
}
/* Хватит ли ячеек ещё на одно фото: 1024 — потолок телеграма */
async function photoRoom(len){
  const keys=await cloudKeys();
  if(!keys) return {ok:true,used:-1,need:0};
  const need=Math.ceil(len/PCHUNK)+1;
  return {ok:(keys.length+need)<=990, used:keys.length, need:need};
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]!==undefined?mem[k]:null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} delete mem[k]; }

function fillDefaults(d){
  d.records=d.records||[];
  d.filter=d.filter||'all';
  d.theme=d.theme||'light';
  d.ferts=Array.isArray(d.ferts)?d.ferts:fertsFromRecords(d.records);
  d.plants.forEach(p=>{ if(!p.group) p.group='home'; });   // старые растения → Дом
  return d;
}
function tryParse(raw){
  try{ const d=JSON.parse(raw); if(d&&d.plants) return d; }catch(e){}
  return null;
}
/* Собирает набор кусков по счётчику. Возвращает и текст, и признак дырок. */
async function readChunks(prefix){
  const n=parseInt(await csGet(prefix+'_n')||'0',10);
  if(!n) return {n:0,raw:'',holes:false};
  let s='', holes=false;
  for(let i=0;i<n;i++){
    const v=await csGet(prefix+'_'+i);
    if(v==null||v==='') holes=true;
    s+=(v||'');
  }
  return {n:n,raw:s,holes:holes};
}

async function loadData(){
  let raw=null, holes=false;
  if(CS){
    const got=await readChunks(KEY);
    CLOUD_N=got.n; holes=got.holes;
    if(got.n>0) raw=got.raw;
  }
  if(!raw) raw=lsGet(KEY);

  const d=tryParse(raw);
  if(d && !holes){
    LOADED_RAW=raw;
    return fillDefaults(d);
  }

  /* сюда попали — либо не разобралось, либо часть кусков не прочиталась */
  if(CLOUD_N>0 || (raw && raw.length>40)){
    READ_OK=false;                                  // запись заблокирована
    if(CS){
      const b=await readChunks(BAK);
      if(b.n>0 && !b.holes){
        const bd=tryParse(b.raw);
        if(bd){ BAK_OFFER={raw:b.raw,data:fillDefaults(bd),at:(await csGet(BAK+'_at'))||'—'}; }
      }
    }
    return {plants:[],records:[],filter:'all',theme:'light',ferts:[]};
  }

  // первый запуск: если в хранилище пусто — берём стартовый набор из data.json (если он лежит рядом)
  try{
    const res=await fetch('data.json',{cache:'no-store'});
    if(res.ok){
      const seed=await res.json();
      if(seed && Array.isArray(seed.plants)){
        (seed.plants||[]).forEach((p,i)=>{ if(!p.id) p.id='p'+(Date.now()+i); if(!p.group) p.group='home'; if(!p.emoji) p.emoji='🪴'; });
        return {
          plants:seed.plants,
          records:Array.isArray(seed.records)?seed.records:[],
          filter:seed.filter||'all',
          theme:seed.theme||'light',
          ferts:[]
        };
      }
    }
  }catch(e){}   // нет файла или открыто локально — просто стартуем пустыми

  return {plants:[],records:[],filter:'all',theme:'light',ferts:[]};
}

let SAVE_QUEUE=Promise.resolve(), SAVE_VERSION=0;
function saveData(){
  if(!READ_OK){ showLock(); return false; }         // не читалось — не пишем
  const raw=JSON.stringify(DB);
  const version=++SAVE_VERSION;
  lsSet(KEY,raw);                                   // локальная копия всегда, она же страховка
  if(!CS){ LOADED_RAW=raw; return Promise.resolve(true); }
  setSaveStatus('pending');
  const job=SAVE_QUEUE.then(async()=>{
    // A newer queued snapshot contains all preceding actions.
    if(version!==SAVE_VERSION)return true;
    try{
      const parts=[]; for(let i=0;i<raw.length;i+=CHUNK) parts.push(raw.slice(i,i+CHUNK));
      for(let i=0;i<parts.length;i++){
        if(!await csSet(KEY+'_'+i,parts[i])){
          if(version===SAVE_VERSION){setSaveStatus('error');return failSave();}
          return false;
        }
      }
      if(!await csSet(KEY+'_n',String(parts.length))){
        if(version===SAVE_VERSION){setSaveStatus('error');return failSave();}
        return false;
      }
      LOADED_RAW=raw;
      if(version===SAVE_VERSION)setSaveStatus('saved');
      return true;
    }catch(e){
      if(version===SAVE_VERSION){setSaveStatus('error');return failSave();}
      return false;
    }
  });
  SAVE_QUEUE=job.catch(()=>false);
  return job;
}
function setSaveStatus(state){
  const el=document.getElementById('saveStatus');if(!el)return;
  el.dataset.state=state;
  el.textContent=state==='pending'?'Сохраняю в Telegram…':state==='error'?'Сохранено на устройстве · повторить':'Сохранено';
  el.classList.remove('hidden');
  clearTimeout(el._timer);
  if(state==='saved')el._timer=setTimeout(()=>el.classList.add('hidden'),1800);
}
function failSave(){
  toast('Телеграм не принял запись — сохранила на телефоне');
  return false;
}

/* Один слот копии: куски, счётчик, дата */
async function writeSlot(prefix,raw){
  const ps=[]; for(let i=0;i<raw.length;i+=CHUNK) ps.push(raw.slice(i,i+CHUNK));
  for(let i=0;i<ps.length;i++){ if(!await csSet(prefix+'_'+i,ps[i])) return false; }
  if(!await csSet(prefix+'_n',String(ps.length))) return false;
  return await csSet(prefix+'_at',today());
}
/* Две копии: свежая (раз в день) и недельная — на случай, если беду
   заметили не сразу и свежая успела перезаписаться уже испорченной. */
/* Две копии проверяются независимо: недельная не должна зависеть
   от того, сделана ли уже свежая за сегодня. */
async function makeBackup(force){
  if(!CS || !READ_OK || !LOADED_RAW || LOADED_RAW.length<60) return false;
  if(!DB.plants.length && !DB.records.length) return false;
  let did=false;
  try{
    const wAt=await csGet(BAKW+'_at');
    if(!wAt || !(daysBetween(wAt,today())<7)){
      if(await writeSlot(BAKW,LOADED_RAW)) did=true;
    }
    const at=await csGet(BAK+'_at');
    if(force || at!==today()){
      if(await writeSlot(BAK,LOADED_RAW)) did=true;
    }
  }catch(e){}
  return did;
}

/* Полоса-предупреждение вместо тихой потери данных */
/* Полоса не накрывает шапку, а сдвигает всё вниз на свою высоту */
function lockOffset(px){
  document.body.style.paddingTop = px ? px+'px' : '';
  const top=document.querySelector('.top');
  if(top) top.style.top = px ? px+'px' : '';
}
function hideLock(){
  const el=document.getElementById('lockBar');
  if(el) el.classList.add('hidden');
  lockOffset(0);
}
function showLock(){
  const el=document.getElementById('lockBar');
  if(!el) return;
  el.classList.remove('hidden');
  const txt=document.getElementById('lockText');
  const btn=document.getElementById('lockBtn');
  if(BAK_OFFER){
    txt.textContent='Не удалось прочитать записи. Есть резервная копия от '+shortDate(BAK_OFFER.at)+'. Записывать ничего не буду, пока не решишь.';
    btn.classList.remove('hidden');
    btn.textContent='Открыть копию от '+shortDate(BAK_OFFER.at);
    btn.onclick=async()=>{
      DB=BAK_OFFER.data; LOADED_RAW=BAK_OFFER.raw; READ_OK=true;
      hideLock();
      await saveData();
      toast('Копия открыта'); renderHome();
    };
  } else {
    txt.textContent='Не удалось прочитать записи. Ничего не записываю, чтобы не потерять. Закрой приложение и открой заново.';
    btn.classList.add('hidden');
  }
  requestAnimationFrame(()=>{ lockOffset(el.offsetHeight); });
}

];

/* ---------- Даты ---------- */
const MN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MNn=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const today=()=>iso(new Date());
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000); }
function plural(n,f){ const m=n%10,h=n%100; return (m===1&&h!==11)?f[0]:(m>=2&&m<=4&&(h<10||h>=20))?f[1]:f[2]; }
const dayWord=n=>plural(n,['день','дня','дней']);
const timesWord=n=>plural(n,['раз','раза','раз']);
function shortDate(d){ const x=new Date(d+'T00:00'); return x.getDate()+' '+MN[x.getMonth()].slice(0,3); }

/* ---------- Вычисления ---------- */
const recsOf=id=>DB.records.filter(r=>r.plantId===id).sort((a,b)=>b.date.localeCompare(a.date));
function lastOf(id,type){ const r=recsOf(id).find(r=>r.types.includes(type)); return r?r.date:null; }
function dryness(p){                       // 0 — только полила, 1 и больше — пора
  const l=lastOf(p.id,'water'); if(!l) return 1.2;
  return daysBetween(l,today())/Math.max(1,p.waterEvery);
}
function avgGap(id,type){
  const ds=recsOf(id).filter(r=>r.types.includes(type)).map(r=>r.date).sort();
  if(ds.length<2) return null;
  let s=0; for(let i=1;i<ds.length;i++) s+=daysBetween(ds[i-1],ds[i]);
  return Math.round(s/(ds.length-1));
}
const countLast=(id,type,days)=>recsOf(id).filter(r=>r.types.includes(type)&&daysBetween(r.date,today())<=days).length;

/* ---------- Форма записи ---------- */

/* ---------- Фото растений ----------
   Лежат отдельно от основных данных: ключи ph_<id>_0..N + ph_<id>_n.
   Так отметка полива не перезаписывает мегабайты картинок. */
const PHOTOS={};
const PARTS={};          // временный склад кусочков при загрузке
const PCHUNK=4000;          // предел ячейки телеграма — 4096 символов
const PMAX=44000;           // потолок на одно фото: 11 ячеек
const PSIDE=400;            // длинная сторона после сжатия
let pendingPhoto;           // undefined — не трогали, null — убрать, строка — новое
/* Фото в разметку целиком не вставляем: браузер разбирал бы его заново
   при каждой перерисовке. Готовим короткую ссылку и держим её наготове. */
const PHOTO_URL={};
function photoUrl(id){
  if(PHOTO_URL[id]) return PHOTO_URL[id];
  const d=PHOTOS[id];
  if(!d) return '';
  try{
    const bin=atob(d.slice(d.indexOf(',')+1));
    const arr=new Uint8Array(bin.length);
    for(let k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k);
    PHOTO_URL[id]=URL.createObjectURL(new Blob([arr],{type:'image/jpeg'}));
  }catch(e){ PHOTO_URL[id]=d; }
  return PHOTO_URL[id];
}
function forgetPhotoUrl(id){
  const u=PHOTO_URL[id];
  if(u && u.indexOf('blob:')===0){ try{ URL.revokeObjectURL(u); }catch(e){} }
  delete PHOTO_URL[id];
}

function csGetMany(keys){
  // getItems есть не во всех версиях — если его нет, читаем по одному
  if(CS && typeof CS.getItems==='function'){
    return new Promise(r=>{ try{ CS.getItems(keys,(e,v)=>r(e?{}:(v||{}))); }catch(e){ r({}); } });
  }
  return (async()=>{ const o={}; for(const k of keys){ const v=await csGet(k); if(v) o[k]=v; } return o; })();
}
function csDel(keys){
  if(CS && typeof CS.removeItems==='function'){
    return new Promise(r=>{ try{ CS.removeItems(keys,()=>r()); }catch(e){ r(); } });
  }
  return (async()=>{ for(const k of keys){ await new Promise(r=>{ try{ CS.removeItem(k,()=>r()); }catch(e){ r(); } }); } })();
}

/* Уменьшение и сжатие: давим качество, пока не влезет в потолок */
function fileToThumb(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let side=PSIDE, out=null;
      for(let pass=0; pass<3; pass++){
        const k=Math.min(1, side/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);          // под прозрачный PNG
        ctx.drawImage(img,0,0,w,h);
        let q=0.72;
        out=c.toDataURL('image/jpeg',q);
        while(out.length>PMAX && q>0.34){ q-=0.08; out=c.toDataURL('image/jpeg',q); }
        if(out.length<=PMAX) return resolve(out);
        side=Math.round(side*0.75);                            // не влезло — уменьшаем сторону
      }
      resolve(out && out.length<=PMAX ? out : null);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src=url;
  });
}

async function savePhoto(plantId,dataUri){
  const p=DB.plants.find(x=>x.id===plantId);
  const stamp=Date.now();
  if(p) p.photoAt=stamp;
  forgetPhotoUrl(plantId);
  PHOTOS[plantId]=dataUri;
  lsSet('ph_'+plantId,dataUri);
  lsSet('ph_'+plantId+'_at',String(stamp));
  if(!CS) return true;
  const parts=[]; for(let i=0;i<dataUri.length;i+=PCHUNK) parts.push(dataUri.slice(i,i+PCHUNK));
  for(let i=0;i<parts.length;i++) await csSet('ph_'+plantId+'_'+i,parts[i]);
  await csSet('ph_'+plantId+'_n',String(parts.length));
  return true;
}
async function dropPhoto(plantId){
  forgetPhotoUrl(plantId);
  delete PHOTOS[plantId];
  try{ lsDel('ph_'+plantId); lsDel('ph_'+plantId+'_at'); }catch(e){}
  { const p=DB.plants.find(x=>x.id===plantId); if(p) delete p.photoAt; }
  if(!CS) return;
  const n=parseInt(await csGet('ph_'+plantId+'_n')||'0',10);
  const keys=['ph_'+plantId+'_n'];
  for(let i=0;i<n;i++) keys.push('ph_'+plantId+'_'+i);
  await csDel(keys);
}
/* Копия на телефоне считается свежей, если её метка совпадает с меткой
   растения. Метка живёт в основных данных, поэтому синхронна между
   устройствами: поменяла фото на другом телефоне — метка разойдётся,
   и фото перекачается. Иначе облако не трогаем вообще. */
function photoStamp(p){ return String((p && p.photoAt) || ''); }
function localPhoto(p){
  const v=lsGet('ph_'+p.id);
  if(!v) return null;
  return (lsGet('ph_'+p.id+'_at')||'')===photoStamp(p) ? v : null;
}

/* Грузим не на старте, а после первой отрисовки — список появляется сразу */
async function loadPhotos(){
  if(!DB.plants.length) return false;
  let touched=false;
  const stale=[];
  DB.plants.forEach(p=>{
    const v=localPhoto(p);
    if(v){ if(PHOTOS[p.id]!==v){ forgetPhotoUrl(p.id); PHOTOS[p.id]=v; touched=true; } }
    else stale.push(p);
  });
  if(!CS || !stale.length) return touched;          // всё своё, в облако не ходим

  const ids=stale.map(p=>p.id);
  const counts=await csGetMany(ids.map(id=>'ph_'+id+'_n'));
  const need=[];
  ids.forEach(id=>{
    const n=parseInt(counts['ph_'+id+'_n']||'0',10);
    for(let i=0;i<n;i++) need.push('ph_'+id+'_'+i);
  });
  for(let i=0;i<need.length;i+=50){
    const got=await csGetMany(need.slice(i,i+50));
    Object.keys(got).forEach(k=>{ if(got[k]) PARTS[k]=got[k]; });
  }
  stale.forEach(p=>{
    const n=parseInt(counts['ph_'+p.id+'_n']||'0',10);
    if(!n) return;
    let s=''; for(let i=0;i<n;i++) s+=(PARTS['ph_'+p.id+'_'+i]||'');
    if(s){
      if(s!==PHOTOS[p.id]){ forgetPhotoUrl(p.id); PHOTOS[p.id]=s; touched=true; }
      lsSet('ph_'+p.id,s);
      lsSet('ph_'+p.id+'_at',photoStamp(p));
      delete PARTS['ph_'+p.id+'_0'];
    }
  });
  return touched;
}

let indexedRecords=null,indexedLength=-1,latestCare=new Map();
lastOf=function(id,type){
 if(indexedRecords!==DB.records||indexedLength!==DB.records.length){
   latestCare=new Map();indexedRecords=DB.records;indexedLength=DB.records.length;
   DB.records.forEach(r=>r.types.forEach(t=>{const key=r.plantId+'|'+t,prev=latestCare.get(key);if(!prev||r.date>prev)latestCare.set(key,r.date);}));

function refDateStatus(p,type){
 const last=lastOf(p.id,type);if(!last)return {main:'Нет записи',date:'Добавь первую дату',due:false};
 const interval=Math.max(1,Number(type==='water'?p.waterEvery:p.feedEvery)||1);
 const next=new Date(last+'T00:00');next.setDate(next.getDate()+interval);
 const left=daysBetween(today(),iso(next));
 return {main:left<=0?'Сегодня':'Через '+left+' '+dayWord(left),date:shortDate(iso(next))+' '+next.getFullYear(),due:left<=0};
}
function wateringProgress(p){
 const last=lastOf(p.id,'water');
 if(!last)return {state:'unknown',lastLabel:'Полив ещё не отмечен',age:'Добавь первую запись',nextLabel:'Срок пока неизвестен',percent:null};
 const age=daysBetween(last,today());
 const interval=Math.max(1,Number(p.waterEvery)||1);
 const next=new Date(last+'T00:00');next.setDate(next.getDate()+interval);
 const remaining=daysBetween(today(),iso(next));
 const lastDate=shortDate(last)+(last.slice(0,4)!==today().slice(0,4)?' '+last.slice(0,4):'');
 if(age<0)return {state:'future',lastLabel:'Полив указан на '+lastDate,age:'Запись будущей датой',nextLabel:'Проверь дату полива',percent:null};
 const ageLabel=age===0?'сегодня':age===1?'вчера':age+' '+dayWord(age)+' назад';
 const nextLabel=remaining<0?'Просрочен на '+(-remaining)+' '+dayWord(-remaining):remaining===0?'Пора полить сегодня':remaining===1?'Следующий полив завтра':'Следующий через '+remaining+' '+dayWord(remaining);
 return {state:remaining<0?'overdue':remaining<=1?'due':'normal',lastLabel:'Поливала '+lastDate,age:ageLabel,nextLabel,percent:Math.round(Math.max(0,Math.min(100,age/interval*100)))};
}
function wateringProgressHtml(p){
 const s=wateringProgress(p);
 const description=s.lastLabel+', '+s.age+'. '+s.nextLabel+'.';
 const bar=s.percent===null?'<div class="watering-track unknown" aria-hidden="true"><span></span></div>':'<div class="watering-track" role="progressbar" aria-label="Срок до следующего полива" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+s.percent+'" aria-valuetext="'+esc(description)+'"><span style="width:'+s.percent+'%"></span></div>';
 return '<div class="watering-progress '+s.state+'"><div class="watering-last">'+uiIcon('water')+'<span>'+esc(s.lastLabel)+'</span></div><div class="watering-age">'+esc(s.age)+'</div>'+bar+'<div class="watering-next">'+esc(s.nextLabel)+'</div></div>';
}
function refArt(p){return p.demoArt?'<div class="reference-art '+esc(p.demoArt)+'" aria-label="Иллюстрация из макета"></div>':PHOTOS[p.id]?'<div class="reference-photo" style="background-image:url(\''+photoUrl(p.id)+'\')"></div>':'<div class="reference-placeholder">'+(p.emoji==='🪴'?uiIcon('leaf'):esc(p.emoji))+'</div>';}

 }).join(''):'<div class="empty"><div class="leaf">🌿</div><h3>'+ (uiView==='care'?'На сегодня всё':DB.plants.length?'В этом разделе пусто':'Здесь будут твои растения')+'</h3><p>'+(uiView==='care'?'По сохранённым датам и интервалам срочных дел нет.':'Добавь растение через меню вверху.')+'</p></div>';

};

renderPlant=function(id){
